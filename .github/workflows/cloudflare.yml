name: Deploy HOVERGHINI to Cloudflare
on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub environment (configure its variables and secrets first)
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_DATABASE_ID: ${{ vars.CF_DATABASE_ID }}
      CF_DATABASE_NAME: ${{ vars.CF_DATABASE_NAME }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
      ECONOMY_ENABLED: ${{ vars.ECONOMY_ENABLED }}
      CREWS_ENABLED: ${{ vars.CREWS_ENABLED }}
      PROPERTIES_ENABLED: ${{ vars.PROPERTIES_ENABLED }}
      PROPERTY_SOURCE_URL: ${{ vars.PROPERTY_SOURCE_URL }}
      MULTIPLAYER_ENABLED: ${{ vars.MULTIPLAYER_ENABLED }}
      APP_CONTACT: ${{ vars.APP_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/configure-cloud.mjs
      - run: npx wrangler deploy --config wrangler.toml --dry-run
      - run: npm run migrate:remote
      - run: npx wrangler deploy --config wrangler.toml
