name = "hoverjuice-api"
main = "server/api.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
# Enable only on the HTTPS host serving BOTH the game and /api routes.
BACKEND_ENABLED = "false"
APP_ORIGIN = "https://YOUR-HOVERJUICE-HOST"
GITHUB_CLIENT_ID = "REPLACE-WITH-OAUTH-CLIENT-ID"
# GITHUB_CLIENT_SECRET must be set with `wrangler secret put`, never here.
# Public playlist JSON; may also be set in the deployed Worker dashboard.
RADIO_CONFIG_JSON = '{"shinobi":[],"liars":[],"hyenas":[],"jesters":[],"talk":[]}'
ALLOWED_ORIGIN = "https://YOUR-HOVERJUICE-HOST"
APP_CONTACT = "mailto:YOUR-CONTACT-EMAIL"
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"

[[d1_databases]]
binding = "DB"
database_name = "hoverjuice-global"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-ID"
migrations_dir = "server/migrations"

[[durable_objects.bindings]]
name = "GEOCODER"
class_name = "Geocoder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Geocoder"]
