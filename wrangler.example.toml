name = "hoverjuice-api"
main = "server/api.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
# Enable only on the HTTPS host serving BOTH the game and /api routes.
BACKEND_ENABLED = "false"
MULTIPLAYER_ENABLED = "false"
PROPERTIES_ENABLED = "false"
CREWS_ENABLED = "false"
ECONOMY_ENABLED = "false"
# Dedicated Overpass-compatible OSM service; no public-service dependency is enabled by default.
PROPERTY_SOURCE_URL = ""
# Optional PROPERTY_SOURCE_TOKEN is a Worker secret.
APP_ORIGIN = "https://YOUR-HOVERJUICE-HOST"
GOOGLE_CLIENT_ID = "REPLACE-WITH-GOOGLE-CLIENT-ID"
# GOOGLE_CLIENT_SECRET is deployed from the GitHub environment secret.
# Optional: existing GitHub accounts can sign in once to link Google.
GITHUB_CLIENT_ID = ""
# GITHUB_CLIENT_SECRET must be set with `wrangler secret put`, never here.
# Public playlist JSON; may also be set in the deployed Worker dashboard.
RADIO_CONFIG_JSON = '{"shinobi":[],"liars":[],"hyenas":[],"jesters":[],"talk":[]}'
ALLOWED_ORIGIN = "https://YOUR-HOVERJUICE-HOST"
APP_CONTACT = "mailto:YOUR-CONTACT-EMAIL"
NOMINATIM_URL = "https://nominatim.openstreetmap.org/search"

[[d1_databases]]
binding = "DB"
database_name = "hoverjuice-global"
database_id = "REPLACE-WITH-YOUR-D1-DATABASE-ID"
migrations_dir = "server/migrations"

[[durable_objects.bindings]]
name = "GEOCODER"
class_name = "Geocoder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Geocoder"]

# Phase 2. These DO bindings are not publicly callable; only the authenticated Worker routes admission.
[[durable_objects.bindings]]
name = "PLAYERS"
class_name = "PlayerSession"

[[durable_objects.bindings]]
name = "CELLS"
class_name = "GeoCell"

[[durable_objects.bindings]]
name = "RACES"
class_name = "CruiseRace"

[[migrations]]
tag = "v2-multiplayer"
new_sqlite_classes = ["PlayerSession", "GeoCell", "CruiseRace"]

[[durable_objects.bindings]]
name = "PROPERTY_SOURCE"
class_name = "PropertySource"

[[migrations]]
tag = "v3-properties"
new_sqlite_classes = ["PropertySource"]

[[durable_objects.bindings]]
name = "TERRITORIES"
class_name = "Territory"

[[migrations]]
tag = "v4-crews"
new_sqlite_classes = ["Territory"]

[[durable_objects.bindings]]
name = "FREIGHT"
class_name = "Freight"

[[migrations]]
tag = "v5-economy"
new_sqlite_classes = ["Freight"]
